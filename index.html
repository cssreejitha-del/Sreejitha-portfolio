<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sreejitha C S — Model</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@300;400;500&family=Raleway:wght@200;300;400&family=EB+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Raleway",sans-serif;background:#f8f6f2;color:#111;overflow-x:hidden}

/* NAV */
nav{position:fixed;top:0;width:100%;display:flex;justify-content:space-between;padding:20px 40px;background:#fff;z-index:10}
nav a{text-decoration:none;color:#000;font-size:12px;letter-spacing:2px}

/* HERO */
#hero{height:100vh;display:flex}
.hero-left{flex:1;background:url("hero.jpg") center/cover}
.hero-right{flex:1;background:#000;color:#fff;display:flex;flex-direction:column;justify-content:center;padding:60px}
.hero-right h1{font-family:"Bodoni Moda";font-size:60px}
.hero-right p{letter-spacing:3px;margin-top:10px;font-size:12px}

/* PORTFOLIO */
#portfolio{padding:100px 40px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid img{width:100%;height:400px;object-fit:cover}

/* ABOUT */
#about{display:flex}
.about-img{flex:1;background:url("img3.jpg") center/cover;height:500px}
.about-text{flex:1;padding:60px}
.about-text h2{font-family:"Bodoni Moda";font-size:40px}

/* CONTACT */
#contact{padding:100px 40px;text-align:center}
footer{text-align:center;padding:20px;background:#000;color:#fff;font-size:12px}

@media(max-width:768px){
  #hero{flex-direction:column}
  #about{flex-direction:column}
  .grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<nav>
  <a href="#">Sreejitha C S</a>
  <div>
    <a href="#portfolio">WORK</a>
    <a href="#about">ABOUT</a>
    <a href="#contact">CONTACT</a>
  </div>
</nav>

<section id="hero">
  <div class="hero-left"></div>
  <div class="hero-right">
    <h1>Sreejitha C S</h1>
    <p>COMMERCIAL • LIFESTYLE • ETHNIC</p>
  </div>
</section>

<section id="portfolio">
  <h2 style="text-align:center;margin-bottom:40px;font-family:'Bodoni Moda'">Portfolio</h2>
  <div class="grid">
    <img src="img1.jpg">
    <img src="img2.jpg">
    <img src="img3.jpg">
    <img src="img4.jpg">
    <img src="img5.jpg">
    <img src="img6.jpg">
    <img src="img7.jpg">
    <img src="img8.jpg">
    <img src="img9.jpg">
  </div>
</section>

<section id="about">
  <div class="about-img"></div>
  <div class="about-text">
    <h2>About</h2>
    <p>A versatile model with strong on-camera presence and natural expression.</p>
  </div>
</section>

<section id="contact">
  <h2>Contact</h2>
  <p>Phone: 89219 02720</p>
  <p>Email: cssreejitha@gmail.com</p>
</section>

<footer>
  © 2025 Sreejitha C S
</footer>

</body>
</html>
